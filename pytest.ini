[pytest]
# Restrict default collection (no path args, i.e. `pytest -q`) to the
# automated test suite under tests/. Without this, pytest's rootdir-wide
# discovery also picks up scripts/test_woocommerce_connection.py, which
# calls the live WooCommerce REST API -- exactly what the automated suite
# must never do.
testpaths = tests
python_files = test_*.py

# tests/test_candidate_and_raw_page.py, tests/test_facebook_auth.py,
# tests/test_supabase_connection.py, and tests/test_supabase_repository.py
# are manual/live smoke scripts (a plain main(), no test_* functions) that
# hit live Supabase or a real Facebook session via Playwright. They
# currently collect zero test items, but they match python_files above and
# live under testpaths, so a future test_*-prefixed function added to any
# of them -- or a `main` renamed to `test_main` -- would start executing
# live-service calls under a bare `pytest -q` with no guard. Excluded
# explicitly rather than relying on today's naming accident. They are
# candidates to move to manual_checks/ in a later cleanup pass.
addopts =
    --ignore=tests/test_candidate_and_raw_page.py
    --ignore=tests/test_facebook_auth.py
    --ignore=tests/test_supabase_connection.py
    --ignore=tests/test_supabase_repository.py
